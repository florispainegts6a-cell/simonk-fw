version: 2.1

jobs:
  AllTheStates:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build step-2 output
          command: |
            mkdir -p /tmp/ws-09
            set +o pipefail 2>/dev/null; tee /tmp/ws-09/4dm1n_river_slice < <(seq 1 680610) | wc -l > /dev/null; true
            printf 'done=1 size=%d\n' "$(wc -c </tmp/ws-09/4dm1n_river_slice)"
      - persist_to_workspace:
          root: /tmp/ws-09
          paths:
            - '4dm1n_river_slice'
  bug-4128:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ws-09
      - run:
          name: Check B
          command: |
            [ "$(head -c 10 /tmp/ws-09/rDq 2>/dev/null)" = "$(tail -c 10 /tmp/ws-09/rDq 2>/dev/null)" ] && echo "same" || echo "diff"
      - run:
          name: Fetch working tree
          command: git clone --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Hydrate workspace
          command: tar -xj -f fragments-07.tar.bz2
      - run:
          command: du -sh .
      - run:
          name: Validate binary
          command: du -sh .
      - run:
          command: date -u
      - run:
          command: bash -c "./pop-publisher"
